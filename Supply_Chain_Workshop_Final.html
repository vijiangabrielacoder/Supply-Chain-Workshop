<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supply Chain Workshop — Mission Game</title>
<style>
:root{--bg:#07131d;--panel:#102331;--panel2:#142c3b;--line:#294555;--text:#eef5f8;--muted:#a8bbc5;--mint:#35c6a4;--gold:#f2c968;--red:#ef7279;--blue:#8fbaff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#17384a 0,#07131d 48%);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);line-height:1.55}.wrap{max-width:900px;margin:auto;padding:22px 16px 44px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:24px}.brand{font-size:12px;letter-spacing:2px;font-weight:900;color:var(--mint)}.pill{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:5px 9px;border-radius:99px}.hero,.panel{background:linear-gradient(150deg,rgba(19,42,57,.98),rgba(11,27,39,.98));border:1px solid var(--line);border-radius:22px;padding:clamp(20px,5vw,36px);box-shadow:0 18px 50px #0002}.kicker{color:var(--mint);font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.hero h1{font-size:clamp(36px,8vw,64px);line-height:.98;letter-spacing:-2px;margin:14px 0}.hero p,.muted{color:var(--muted)}h2{font-size:clamp(24px,5vw,34px);line-height:1.1;margin:10px 0 14px}h3{margin:0 0 8px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:22px}.mission{border:1px solid var(--line);border-radius:16px;padding:20px;background:#0b1b27}.mission .num{font-size:11px;letter-spacing:1.5px;color:var(--gold);font-weight:800}.mission p{color:var(--muted);font-size:14px;min-height:65px}.btn{border:0;border-radius:11px;padding:13px 16px;font-weight:850;cursor:pointer;font-size:14px;background:var(--mint);color:#061710}.btn.secondary{background:#1b3545;color:var(--text);border:1px solid #355366}.btn.gold{background:var(--gold);color:#211a08}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.story{white-space:pre-line;color:#d9e6ec;background:#0a1a25;border-left:3px solid var(--mint);padding:17px;border-radius:0 12px 12px 0;margin:18px 0}.tag{font-size:11px;letter-spacing:1px;font-weight:900;color:var(--gold);text-transform:uppercase}.question{font-size:18px;font-weight:800;margin:18px 0 12px}.choices{display:grid;gap:10px}.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#112735;border:1px solid #2d4a5b;border-radius:12px;color:var(--text);padding:15px;cursor:pointer;line-height:1.4}.choice:hover{border-color:var(--mint)}.choice .letter{color:var(--mint);font-weight:900;min-width:20px}.choice.selected{border-color:var(--mint);background:#12382f}.feedback{display:none;padding:15px;border-radius:12px;margin-top:14px;background:#112d2a;border:1px solid #287765}.feedback.bad{background:#321e25;border-color:#7b3e4b}.feedback.mid{background:#30291a;border-color:#7a6330}.textarea{width:100%;min-height:105px;resize:vertical;background:#081923;border:1px solid #355366;border-radius:12px;padding:13px;color:var(--text);font:inherit}.field{margin:17px 0}.field label{display:block;font-weight:800;margin-bottom:7px}.note{font-size:13px;color:var(--muted)}.divider{height:1px;background:var(--line);margin:22px 0}.checklist{display:grid;gap:10px}.check{display:flex;gap:10px;background:#0a1a25;padding:12px;border-radius:10px}.check input{accent-color:var(--mint);margin-top:5px}.footer{font-size:11px;color:#78909e;text-align:center;margin-top:24px}.backrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:15px}.stagebar{height:5px;background:#213744;border-radius:99px;overflow:hidden;margin:14px 0 22px}.stagebar span{display:block;height:100%;background:var(--mint);width:0}.hide{display:none!important}
@media(max-width:520px){.top{align-items:flex-start}.pill{max-width:140px;text-align:center}.mission p{min-height:0}.btn{width:100%}.actions .btn{flex:1 1 100%}}
</style>
</head>
<body>
<div id="accessGate" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:22px;background:#07131d">
  <section class="panel" style="width:min(480px,100%);text-align:center">
    <div class="kicker">SUPPLY CHAIN MISSION</div><h2>ENTER MISSION</h2>
    <p class="muted">Enter the mission code provided by your facilitator.</p>
    <input id="missionCode" type="password" autocomplete="off" placeholder="MISSION CODE" style="width:100%;padding:14px;border-radius:10px;border:1px solid #355366;background:#081923;color:#eef5f8;text-align:center;font-size:16px;letter-spacing:2px" onkeydown="if(event.key==='Enter')unlockMission()">
    <button class="btn" style="width:100%;margin-top:12px" onclick="unlockMission()">ENTER MISSION →</button><p id="accessError" style="color:#ef7279;min-height:20px"></p>
  </section>
</div>
<div class="wrap" id="mainWrap" style="display:none">
<header class="top"><div class="brand">SUPPLY CHAIN • WORKSHOP SIMULATION</div><div class="pill" id="progressPill">MISSION MENU</div></header>
<main id="app"></main>
<div class="footer">From PO release to customer impact • Make the decision. Own the outcome.</div>
</div>
<script>
const app=document.getElementById('app');
const MISSION_CODE='SUPPLY2026';
function unlockMission(){const input=document.getElementById('missionCode');if(input.value.trim().toUpperCase()===MISSION_CODE){sessionStorage.setItem('supplyChainMissionAccess','granted');document.getElementById('accessGate').style.display='none';document.getElementById('mainWrap').style.display='block';menu()}else{document.getElementById('accessError').textContent='Invalid mission code. Please check and try again.';input.value='';input.focus()}}
if(sessionStorage.getItem('supplyChainMissionAccess')==='granted'){document.getElementById('accessGate').style.display='none';document.getElementById('mainWrap').style.display='block'}
const miniGames=[
{id:'oor',num:'01',title:'OOR & Escalation',subtitle:'The Unacknowledged PO',desc:'A supplier has not acknowledged a critical purchase order. Decide how to follow up, when to escalate, and when operational risk changes the normal process.',scenes:[
{title:'Monday • Week 1',story:'A critical PO has been released. The supplier has not acknowledged it. There is no confirmed blocker yet.',q:'What is the correct first action?',opts:[
['Send the OOR request and record the follow-up date.','good','Start the normal follow-up cycle.'],
['Immediately escalate to the Supplier Leader and Team Lead.','bad','This skips the normal first steps when there is no immediate critical risk.'],
['Wait until the required date is close.','bad','The missing acknowledgement is already a risk and needs active follow-up.']]},
{title:'Wednesday • Week 1',story:'There is still no response after the first OOR contact.',q:'What should happen next?',opts:[
['Send a reminder and continue documenting the contact attempts.','good','Continue the follow-up cadence.'],
['Close the OOR because an email was sent.','bad','Sending a message does not mean the supplier has acknowledged the PO.'],
['Escalate to everyone in the supply chain organisation immediately.','bad','Use the agreed escalation ladder unless operational risk requires urgent action.']]},
{title:'Thursday • Week 1',story:'The supplier still has not responded.',q:'What is the next appropriate step?',opts:[
['Call the supplier and continue the documented follow-up.','good','Use a direct call after the reminder.'],
['Stop following up until next week.','bad','The missing acknowledgement remains unresolved.'],
['Mark the PO as acknowledged.','bad','Never record an acknowledgement that has not been received.']]},
{title:'Week 3 • Critical supplier',story:'Two weeks of follow-up have not resulted in an acknowledgement. This is a critical supplier, but no immediate production stop has been reported.',q:'Who should now be involved?',opts:[
['Escalate to the Supplier Leader and Team Lead, with the history and risk clearly stated.','good','This follows the agreed escalation path for a critical supplier from Week 3.'],
['Keep sending the same email without escalating.','bad','The escalation threshold has been reached.'],
['Cancel the PO without investigating the blocker.','bad','Cancellation is not a substitute for resolving the supplier acknowledgement issue.']]},
{title:'Critical operational risk',story:'The centre reports: “STOP PRODUCTION — CRITICAL EQUIPMENT SHORTAGE.” The normal follow-up timeline is no longer sufficient.',q:'What is the best response?',opts:[
['Call the supplier immediately, alert relevant stakeholders, agree an action plan and actively follow up.','good','Critical operational risk overrides the normal waiting cycle. Document the actual risk and actions.'],
['Wait for the next scheduled reminder.','bad','Do not wait when operations are at immediate risk.'],
['Use “REVENUE LOSS” even though no loss has occurred yet.','bad','Use “REVENUE LOSS” only when actual loss has occurred. Use the accurate risk wording.']]}
]},
{id:'amp',num:'02',title:'AMP',subtitle:'One Message. One Clear Outcome.',desc:'Work through expedite, de-expedite and cancellation situations. Decide when an AMP can close and what must be updated.',scenes:[
{title:'Scenario 1 • Expedite accepted',story:'The supplier accepts the requested expedite date. The accepted date is feasible and clear.',q:'What should you do?',opts:[
['Close the AMP with the accepted date and update the SAP confirmation.','good','Record the commitment, close the AMP and update the confirmation. Keep AMS on every PO line.'],
['Close the AMP but leave the SAP confirmation unchanged.','bad','The system confirmation must reflect the agreed date.'],
['Remove AMS because the AMP is closed.','bad','AMS must remain on every PO line, regardless of AMP status.']]},
{title:'Scenario 2 • Better date offered',story:'The supplier cannot meet the requested expedite date but offers a feasible earlier date than the current confirmation.',q:'How should you handle this?',opts:[
['Use the feasible Best Date, close the AMP and update the SAP confirmation.','good','The feasible alternative can become the Best Date and commitment.'],
['Keep the AMP open indefinitely because the requested date was rejected.','bad','If the feasible alternative is accepted as the Best Date, close and record it.'],
['Keep the old confirmation and only write a note in email.','bad','Update the relevant SAP confirmation.']]},
{title:'Scenario 3 • Supplier will check',story:'The supplier replies: “We will check internally and get back to you.” No date is accepted yet.',q:'What is the correct status?',opts:[
['Keep the AMP open and follow up until a date is confirmed.','good','A promise to check is not acceptance of the requested date.'],
['Close the AMP because the supplier replied.','bad','A reply alone is not a confirmed commitment.'],
['Enter the requested date as accepted.','bad','Do not record a date the supplier has not committed to.']]},
{title:'Scenario 4 • De-expedite across quarter end',story:'The confirmed date is 25 March (Q1). A de-expedite request asks for 15 May (Q2). The supplier offers 28 March, still in Q1.',q:'What should you do?',opts:[
['Keep the AMP open and push for a feasible date in Q2, or the best feasible date outside Q1.','good','The offered date does not meet the quarter change requested. Continue follow-up until a suitable date is agreed.'],
['Accept 28 March and close the AMP immediately.','bad','The offer does not meet the requested Q2 timing.'],
['Close as Invalid because the supplier offered a date.','bad','The request remains valid; the supplier has not met the requested timing.']]},
{title:'Scenario 5 • Cancellation accepted',story:'The supplier accepts cancellation. The centre still needs to cancel the related PR.',q:'What is the correct sequence?',opts:[
['Ensure the centre cancels the PR; close the AMP; ensure AMS is on the PO line; then close the PO line with an approval note explaining why.','good','Complete the process controls and keep the reason traceable.'],
['Close the PO line first and ask the centre to cancel the PR later.','bad','Follow the agreed cancellation sequence.'],
['Remove AMS and close the AMP as Invalid.','bad','AMS remains on the PO line and this is an accepted cancellation, not an invalid AMP.']]},
{title:'Scenario 6 • Invalid AMP?',story:'You review the original AMP request date and the new Need Date. Only one of these dates is in the past.',q:'Can you close the AMP as Invalid?',opts:[
['No. Close as Invalid only when both the original AMP request date and the new Need Date are in the past.','good','If either date is not in the past, continue follow-up.'],
['Yes. One date in the past is enough.','bad','Both dates must be in the past.'],
['Yes, whenever the supplier has not replied.','bad','Lack of reply is not the Invalid rule.']]}
]},
{id:'dates',num:'03',title:'Date Management',subtitle:'The Date Is Not Just a Date',desc:'Choose the correct date type, update the right records, and manage split deliveries without creating avoidable errors.',scenes:[
{title:'Scenario 1 • Incoterms',story:'You need to validate a supplier confirmation date before updating the system.',q:'Which date should be used?',opts:[
['EXW: Shipping Date. DDP: Delivery Date.','good','Use the date appropriate to the Incoterm.'],
['EXW: Delivery Date. DDP: Shipping Date.','bad','These date types are reversed.'],
['Always use the PO line date regardless of Incoterm.','bad','The relevant confirmation date depends on the Incoterm.']]},
{title:'Scenario 2 • Confirmation changed',story:'The supplier confirms a new date. The PO line has already been acknowledged and is not past due.',q:'What should you update?',opts:[
['Update the relevant SAP confirmation, AMS and applicable AMP; do not automatically change the PO line date.','good','A confirmation change does not automatically mean the PO line date should change.'],
['Change the PO line date every time confirmation changes.','bad','PO line date changes are limited to defined conditions.'],
['Update only an email and leave all records untouched.','bad','Keep the relevant system records aligned.']]},
{title:'Scenario 3 • When may PO line date change?',story:'You are reviewing a request to change a PO line date.',q:'Which rule is correct?',opts:[
['Change it if the supplier has not acknowledged the PO and the line is past due, or if our team initiated a schedule change and the supplier specifically requests the change after accepting it.','good','These are the defined conditions. Do not change the PO line date by default.'],
['Change it whenever any confirmation date changes.','bad','That creates unnecessary date changes.'],
['Never change the PO line date under any circumstances.','bad','There are defined exceptions.']]},
{title:'Scenario 4 • Split delivery',story:'Six units are due on 10 November and four units on 28 November. The delivery dates are more than 14 days apart.',q:'What is the correct approach?',opts:[
['Split the PO line, copy the PR from the original line to the new line, and verify the supplier has split the confirmation.','good','The new line needs the correct PR reference and supplier confirmation must match the split.'],
['Leave one PO line and assume the supplier will handle the split.','bad','The PO and supplier confirmation need to reflect the split.'],
['Create a new line without copying the PR.','bad','Copy the PR from the original line when creating the new line.']]},
{title:'Scenario 5 • Price break',story:'Sourcing updates the PIR after a price difference. PO quantity is 10, MOQ is 5, and the first displayed price may refer to quantity 5.',q:'Before changing the PO price, what should you verify?',opts:[
['Review PIR Conditions/Price Breaks and select the price break that applies to quantity 10.','good','Never assume the first displayed price is the correct quantity break.'],
['Use the first price displayed in the PIR.','bad','The first displayed price may be for a different quantity tier.'],
['Change the PO price without checking the PIR.','bad','Validate the applicable price break first.']]}
]},
{id:'otd',num:'04',title:'OTD',subtitle:'The Month-End Truth Check',desc:'Vet the report using the correct dates, AMS context, and agreed cadence.',scenes:[
{title:'Scenario 1 • Too Early?',story:'Performance Date: 12 October. Delivery Date: 8 October. GR Date: 8 October. AMS is On Track. The report flags the line as Too Early.',q:'If delivery and GR were completed in the same calendar month as the Performance Date, how should it be classified?',opts:[
['On Time, after validating the dates and AMS context.','good','Same-calendar-month delivery and GR should be marked On Time in this scenario.'],
['Late, because delivery is before the Performance Date.','bad','This is the report’s Too Early exception, not a late delivery.'],
['Leave it unvetted because the report flag is enough.','bad','Validate the exception rather than accepting the report label blindly.']]},
{title:'Scenario 2 • AMS indicates delay',story:'The dates appear to match the Performance Date, but AMS indicates a delay.',q:'What should you do during vetting?',opts:[
['Do not classify it as On Time while AMS indicates a delay; investigate and correct the record using the approved CLM process.','good','AMS context matters. Use the approved internal correction code; do not guess one.'],
['Ignore AMS if the GR date looks good.','bad','AMS may indicate that the order was not on track.'],
['Invent a correction code to clear the exception.','bad','Use only the approved CLM process and correction code.']]},
{title:'Scenario 3 • Vetting cadence',story:'You are planning the team’s OTD vetting activities.',q:'Which cadence and deadline should you follow?',opts:[
['Vet every two weeks and complete the previous month’s vetting by the 5th of the following month.','good','Keep the routine cadence and month-end deadline visible.'],
['Vet once per quarter, when time allows.','bad','This misses the agreed cadence.'],
['Wait for a customer escalation before vetting.','bad','Vetting is a proactive control.']]},
{title:'Scenario 4 • AMS On Track',story:'The report flags an exception, but AMS is On Track. You have checked the GR date and Performance Date.',q:'What is the right next step?',opts:[
['Validate the exception against the actual dates and applicable rules, then record the correct classification.','good','On Track is a positive signal, but the classification still needs date validation.'],
['Automatically mark every On Track line as On Time without checking dates.','bad','AMS does not replace date validation.'],
['Ignore the line because AMS is On Track.','bad','Complete the vetting and record the outcome.']]}
]},
{id:'price',num:'05',title:'Price Updates',subtitle:'The Price Break Trap',desc:'Avoid incorrect PO prices by checking the right quantity break and following the right sequence with Sourcing and PIR.',scenes:[
{title:'Scenario 1 • Lower price',story:'Illustrative PIR breaks: quantity 5–9 = €120/unit; quantity 10–19 = €105/unit; quantity 20+ = €95/unit. PO quantity is 10. The first displayed price is €120. The supplier has provided a new lower price and Sourcing has been informed, but the PIR has not yet been updated.',q:'What should you do first?',opts:[
['Review the PIR Conditions/Price Breaks and verify the correct tier for quantity 10; because the new price is lower, the PO price may be updated before the PIR update provided Sourcing has been informed.','good','For quantity 10, the illustrative applicable tier is €105. Verify the break and ensure Sourcing has been informed.'],
['Use €120 because it is the first price displayed.','bad','The first price may belong to a different quantity tier.'],
['Wait for PIR update in every case, even when the new price is lower and Sourcing has been informed.','bad','The agreed rule allows a lower PO price before PIR update, provided Sourcing has been informed.']]},
{title:'Scenario 2 • Higher price',story:'A supplier proposes a new price higher than the current PO price. Sourcing has been informed, but the PIR has not been updated.',q:'Can you change the PO price now?',opts:[
['No. Wait for the PIR update before changing the PO price, and verify the applicable price break.','good','Higher price: wait for PIR update before changing the PO.'],
['Yes, change the PO immediately because Sourcing knows about it.','bad','For a higher price, wait until the PIR is updated.'],
['Use whichever price is easiest to select.','bad','Always verify the applicable quantity break.']]},
{title:'Scenario 3 • Send new price',story:'You have verified the new supplier price and the relevant quantity break.',q:'How should the new price be sent to Sourcing?',opts:[
['Send the new price by email or Excel, with enough detail to validate the applicable break.','good','Make the proposed price and applicable quantity tier clear.'],
['Only mention the new price verbally and make no record.','bad','Keep a traceable record.'],
['Update the PO without informing Sourcing.','bad','Sourcing must be informed; higher prices require the PIR update first.']]}
]}
];
let state={game:null,index:0,answers:{},history:[],finalAnswers:{},finalStage:0};
const finalStages=[
{title:'Briefing • One Supplier. Multiple Risks.',story:'A critical piece of equipment is needed at an oil and gas site. The PO has been released, but the supplier has not acknowledged it. The schedule is under pressure, a price discrepancy has appeared, and OTD exceptions need vetting.\n\nYour job is to stabilise the situation, protect the operation, and keep the records accurate.',fields:[['priority','What are the first risks you would assess, and why?'],['stakeholders','Who needs to be contacted immediately? What would you communicate?']]},
{title:'Stage 1 • STOP PRODUCTION',story:'The centre emails: “STOP PRODUCTION — REVENUE AT RISK.” The supplier has not acknowledged the PO. There is no confirmed actual revenue loss yet.',fields:[['actions','List your first three actions in order.'],['supplier','What would you ask the supplier, and what commitment do you need?'],['record','What would you document and how would you follow up?']]},
{title:'Stage 2 • A Better Expedite Date',story:'The supplier rejects the requested expedite date of 15 November but offers 20 November. The current SAP confirmation is 30 November.',fields:[['amp','What would you do with the AMP and why?'],['date','Which date would you record, and what would you update in SAP?'],['follow','What commitment or evidence would you secure?']]},
{title:'Stage 3 • Price / PIR Discrepancy',story:'The PO quantity is 10. Illustrative PIR breaks: 5–9 = €120/unit; 10–19 = €105/unit; 20+ = €95/unit. The first displayed price is €120. The supplier’s new price is lower than the current PO price, but PIR has not yet been updated.',fields:[['first','What would you check first before changing the PO price?'],['lower','Can the PO price be updated before PIR is changed? Explain the condition.'],['higher','What would you do differently if the new price were higher than the current PO price?']]},
{title:'Stage 4 • Split Delivery',story:'The supplier now confirms 6 units for 10 November and 4 units for 28 November. The dates are more than 14 days apart.',fields:[['split','How would you manage the PO lines and PR reference?'],['supplierconfirm','What must you verify in the supplier’s confirmation?'],['records','Which records and dates need checking or updating?']]},
{title:'Stage 5 • OTD Exception',story:'Performance Date: 12 October. Delivery Date: 8 October. GR Date: 8 October. AMS is On Track. The report flags the line as Too Early.',fields:[['classify','How would you classify this case and what would you validate first?'],['cadence','What is the OTD vetting cadence and monthly deadline?'],['exception','What would you do if AMS instead indicated a delay?']]},
{title:'Final Debrief • Own the Action Plan',story:'You have reviewed the acknowledgement risk, expedite, price discrepancy, split delivery and OTD exception. Now turn your decisions into a practical action plan.',fields:[['plan','Prioritise the next actions. Who owns each action and by when?'],['recordsfinal','Which systems, records or confirmations must be updated?'],['risksleft','What risks remain, and what evidence would tell you the mission is complete?']]}
];
function menu(){state.game=null;document.getElementById('progressPill').textContent='MISSION MENU';app.innerHTML=`<section class="hero"><div class="kicker">Workshop simulation</div><h1>FROM PO<br>TO CUSTOMER</h1><p>Five focused mini-games. Real supply-chain decisions. A final open-ended challenge that brings the whole process together.</p><div class="story">Make a decision, review the consequence, and pause for a facilitator-led discussion. Use the Back button to revisit the previous scenario; your choices are preserved.</div><div class="grid">${miniGames.map(g=>`<article class="mission"><div class="num">MISSION ${g.num}</div><h3>${g.title}</h3><strong>${g.subtitle}</strong><p>${g.desc}</p><button class="btn" onclick="startGame('${g.id}')">Start mission →</button></article>`).join('')}<article class="mission" style="border-color:#7c70d6"><div class="num" style="color:#b4aaff">FINAL CHALLENGE</div><h3>Save the Delivery</h3><strong>One Supplier. Multiple Risks.</strong><p>Open-ended integrated scenario. Explain your reasoning and build an action plan—no pre-defined answers.</p><button class="btn gold" onclick="startFinal()">Enter Final Challenge →</button></article></div></section>`}
function startGame(id){state.game=id;state.index=0;state.history=[];state.answers[id]??={};renderGame()}
function renderGame(){let g=miniGames.find(x=>x.id===state.game),s=g.scenes[state.index],ans=state.answers[g.id][state.index];document.getElementById('progressPill').textContent=`MISSION ${g.num} • ${state.index+1}/${g.scenes.length}`;app.innerHTML=`<div class="backrow"><button class="btn secondary" onclick="goBack()">← Back</button><button class="btn secondary" onclick="menu()">Back to Mission Menu</button></div><section class="panel"><div class="tag">MISSION ${g.num} • ${g.title}</div><h2>${g.subtitle}</h2><div class="stagebar"><span style="width:${(state.index+1)/g.scenes.length*100}%"></span></div><h3>${s.title}</h3><div class="story">${s.story}</div><div class="question">${s.q}</div><div class="choices">${s.opts.map((o,i)=>`<button class="choice ${ans===i?'selected':''}" onclick="choose(${i})" ${ans!==undefined?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${o[0]}</span></button>`).join('')}</div><div class="feedback ${ans!==undefined?(s.opts[ans][1]==='good'?'':'bad'):''}" id="feedback" style="${ans!==undefined?'display:block':''}">${ans!==undefined?`<strong>${s.opts[ans][1]==='good'?'Good decision':'Consider the risk'}</strong><br>${s.opts[ans][2]}`:''}</div><div class="actions"><button class="btn" onclick="nextGame()" ${ans===undefined?'disabled':''}>${state.index===g.scenes.length-1?'Finish mission & debrief':'Next scenario →'}</button></div></section>`}
function choose(i){let g=miniGames.find(x=>x.id===state.game),s=g.scenes[state.index];state.answers[g.id][state.index]=i;renderGame()}
function goBack(){if(state.game==='final'){state.finalStage=Math.max(0,state.finalStage-1);renderFinal()}else{state.index=Math.max(0,state.index-1);renderGame()}}
function nextGame(){let g=miniGames.find(x=>x.id===state.game);if(state.index<g.scenes.length-1){state.index++;renderGame()}else{renderDebrief(g)}}
function renderDebrief(g){document.getElementById('progressPill').textContent='PAUSE & DISCUSS';let rows=g.scenes.map((s,i)=>{let a=state.answers[g.id][i];return `<div class="story"><strong>${s.title}</strong><br>Your choice: ${a===undefined?'Not answered':s.opts[a][0]}<br><span class="muted">Facilitator prompt: ${s.q}</span></div>`}).join('');app.innerHTML=`<div class="backrow"><button class="btn secondary" onclick="state.index=${g.scenes.length-1};renderGame()">← Back to last scenario</button><button class="btn secondary" onclick="menu()">Back to Mission Menu</button></div><section class="panel"><div class="kicker">Mission complete</div><h2>${g.title} • Pause & Discuss</h2><p class="muted">Review the choices with the group. Ask participants to explain the reasoning, the operational risk, and what they would record or follow up.</p>${rows}<div class="divider"></div><h3>Key takeaways</h3><p>${g.id==='oor'?'Follow the OOR cadence: Monday OOR, Wednesday reminder, Thursday call; repeat in Week 2. From Week 3, escalate a critical unresponsive supplier to Supplier Leader and Team Lead. For critical operational risk, act immediately.':g.id==='amp'?'Keep AMS on every PO line. Close AMP only when the outcome is clear, the correct date is recorded, and SAP confirmation is updated. Cancellation and Invalid rules must be followed exactly.':g.id==='dates'?'EXW uses Shipping Date; DDP uses Delivery Date. Do not automatically change PO line dates when confirmations change. Split deliveries more than 14 days apart and copy the PR to the new line.':g.id==='otd'?'Compare GR Date with Performance Date, validate AMS context, and use the approved CLM process for corrections. Vet every two weeks and finish the previous month by the 5th.':'Check the applicable PIR quantity break. For a lower price, the PO price may be updated before PIR provided Sourcing has been informed; for a higher price, wait for the PIR update.'}</p><div class="actions"><button class="btn" onclick="menu()">Back to Mission Menu</button><button class="btn gold" onclick="startFinal()">Continue to Final Challenge →</button></div></section>`}
function startFinal(){state.game='final';state.finalStage=0;state.finalAnswers??={};renderFinal()}
function renderFinal(){let i=state.finalStage,s=finalStages[i];document.getElementById('progressPill').textContent=`FINAL CHALLENGE • ${i+1}/${finalStages.length}`;let fields=s.fields.map(([id,label])=>`<div class="field"><label for="f_${id}">${label}</label><textarea class="textarea" id="f_${id}" placeholder="Write your reasoning and next steps...">${escapeHtml(state.finalAnswers[id]||'')}</textarea></div>`).join('');app.innerHTML=`<div class="backrow"><button class="btn secondary" onclick="goBack()" ${i===0?'disabled':''}>← Back</button><button class="btn secondary" onclick="menu()">Back to Mission Menu</button></div><section class="panel"><div class="tag">FINAL CHALLENGE • SAVE THE DELIVERY</div><h2>One Supplier. Multiple Risks.</h2><div class="stagebar"><span style="width:${(i+1)/finalStages.length*100}%"></span></div><h3>${s.title}</h3><div class="story">${s.story}</div><p class="muted">Open-ended exercise: explain your reasoning. There are no pre-defined multiple-choice answers.</p>${fields}<div class="actions"><button class="btn" onclick="saveFinalAndNext()">${i===finalStages.length-1?'Finish & review action plan':'Save answers & continue →'}</button></div></section>`}
function saveFinalAndNext(){let s=finalStages[state.finalStage];s.fields.forEach(([id])=>{let el=document.getElementById('f_'+id);if(el)state.finalAnswers[id]=el.value});if(state.finalStage<finalStages.length-1){state.finalStage++;renderFinal()}else{renderFinalDebrief()}}
function renderFinalDebrief(){document.getElementById('progressPill').textContent='FINAL DEBRIEF';let content=finalStages.flatMap(s=>s.fields.map(([id,label])=>`<div class="field"><label>${label}</label><div class="story">${escapeHtml(state.finalAnswers[id]||'No answer entered.')}</div></div>`)).join('');app.innerHTML=`<div class="backrow"><button class="btn secondary" onclick="state.finalStage=${finalStages.length-1};renderFinal()">← Back to final stage</button><button class="btn secondary" onclick="menu()">Back to Mission Menu</button></div><section class="panel"><div class="kicker">Mission review</div><h2>Your action plan</h2><p class="muted">Use this as a facilitator-led debrief. Confirm owners, deadlines, system updates, supplier commitments and remaining risks. Answers remain in this browser session while the page stays open.</p>${content}<div class="actions"><button class="btn" onclick="window.print()">Print / Save as PDF</button><button class="btn gold" onclick="menu()">Return to Mission Menu</button></div></section>`}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
menu();
</script>
</body>
</html>
