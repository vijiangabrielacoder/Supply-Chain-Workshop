const MISSION_CODE = "SUPPLY2026";
function unlockMission(){
 const input=document.getElementById("missionCode");
 const error=document.getElementById("accessError");
 if(input.value.trim().toUpperCase()===MISSION_CODE){
   sessionStorage.setItem("supplyChainMissionAccess","granted");
   document.getElementById("accessGate").style.display="none";
   document.querySelector(".wrap").style.display="block";
   start();
 } else {
   error.textContent="Invalid mission code. Please check the code and try again.";
   input.value=""; input.focus();
 }
}
function initAccess(){
 const gate=document.getElementById("accessGate");
 const wrap=document.querySelector(".wrap");
 wrap.style.display="none";
 if(sessionStorage.getItem("supplyChainMissionAccess")==="granted"){
   gate.style.display="none"; wrap.style.display="block"; start();
 }
}

["Work the AMP first, then worry about AMS later.","bad","a2"],["For every meaningful change, drive the AMP action and keep the PO date + AMS aligned with the real situation.","good","a2"],["AMS is only a reporting field and does not need updating during the action.","bad","a2"],["Close the AMP once the supplier has been contacted.","delay","a2"]]},
a2:{id:"a2",n:"02",time:"08:15 AM • HIGH-VALUE EXPEDITE",title:"PRIORITY + SUPPLIER CONTACT",story:`The €480,000 expedite is needed in the <strong>current quarter</strong>. This is both high value and urgent.<br><br>The correct first move is to contact the supplier directly. Because of the exposure, one channel is not enough.`,q:"What do you do?",opts:[
["Send an email and wait for the normal response cycle.","delay","a2b"],["Call + email the supplier, clearly asking whether they can meet the expedite and requesting a firm commitment.","good","a2b"],["Put the AMP into Awaiting Vendor without contacting the supplier.","bad","a2b"],["Change the AMS to ON TRACK because the centre requested an expedite.","bad","a2b"]]},
a2b:{id:"a2b",n:"03",time:"08:45 AM • NO ANSWER YET",title:"AWAITING VENDOR",story:`The supplier has not confirmed the expedite yet. You have made contact, but there is no commitment.<br><br>The PO is still in the supplier-contact stage. Do not invent a date or pretend the action is complete.`,q:"What should the record show now?",opts:[
["Set the AMP to Awaiting Vendor and keep the current AMS aligned with the actual PO position while waiting.","good","a2c"],["Close the AMP because an email was sent.","bad","a2c"],["Set AMS to ON TRACK even though the supplier has not committed to the expedite.","bad","a2c"],["Change the PO date to the requested expedite date without supplier confirmation.","bad","a2c"]]},

["Close the AMP only; leave the old date and AMS unchanged.","bad","a3"],["Update the confirmed delivery date on the PO, update AMS to the status that reflects the new confirmed/on-track position, communicate the outcome, and close the AMP with the supplier response documented.","good","a3"],["Leave Awaiting Vendor because the supplier answered by email.","delay","a3"],["Change AMS to SUP|DATE CONFIRMATION permanently even though the date is now confirmed.","bad","a3"]]},

["Update the PO delivery date to 18 July, update AMS so it reflects the confirmed current position, inform the supplier/centre as required, and close the AMP with the response documented.","good","a4"],["Close the AMP but leave the old date and SUP|DATE CONFIRMATION unchanged.","bad","a4"],["Leave the AMP Awaiting Vendor because dates can be updated later.","delay","a4"],["Change the date only; AMS does not matter once the supplier has replied.","bad","a4"]]},
a4:{id:"a4",n:"08",time:"03:00 PM • DE-EXPEDITE",title:"NO CONFIRMED ORDER DATE",story:`The centre now wants to <strong>de-expedite</strong> the order. You check the PO and discover that the original supplier date was <strong>never actually confirmed</strong>.<br><br>You cannot simply keep an unconfirmed date and call the AMP complete.`,q:"What is your first move?",opts:[
["Change the line date immediately to whatever looks reasonable.","bad","a4b"],["Contact the supplier, ask what delivery date they can actually support, and keep the AMP active while you establish the real position.","good","a4b"],["Close the AMP because the centre no longer needs the material urgently.","bad","a4b"],["Change AMS to ON TRACK because the order was acknowledged.","bad","a4b"]]},
a4b:{id:"a4b",n:"09",time:"03:30 PM • AWAITING VENDOR",title:"DE-EXPEDITE — WAIT, THEN CHASE",story:`The supplier has not answered yet. The action is genuinely with the vendor.<br><br>While waiting, the order record must not pretend that a new date exists.`,q:"What is the correct control?",opts:[
["Set the AMP to Awaiting Vendor, keep the AMS aligned with the fact that the delivery position is still being established, and chase if there is no response.","good","a4c"],["Set AMS to ON TRACK because no problem has been reported.","bad","a4c"],["Change the date on the line without supplier input.","bad","a4c"],["Close the AMP and wait for the supplier to notice the request.","delay","a4c"]]},
a4c:{id:"a4c",n:"10",time:"NEXT MORNING • SUPPLIER RESPONSE",title:"DE-EXPEDITE — UPDATE EVERYTHING",story:`You chase the supplier. They reply:<br><br><strong>“We can accept the de-expedite. New delivery date: 30 August.”</strong><br><br>Now there is a real supplier-backed position.`,q:"What must happen together?",opts:[
["Close the AMP only; the date can stay as it is.","bad","a5"],["Change the delivery date on the PO line to 30 August, update AMS to reflect the new current PO position, inform the supplier/centre as required, and close the AMP with the response documented.","good","a5"],["Leave AMS in the previous waiting status because it was correct yesterday.","delay","a5"],["Change the date but leave AMS untouched because AMP and AMS are separate processes.","bad","a5"]]},
a5:{id:"a5",n:"11",time:"04:15 PM • GR BLOCKER",title:"DELIVERED DOES NOT ALWAYS MEAN COMPLETE",story:`The material has physically arrived, but the <strong>Goods Receipt (GR)</strong> is blocked because of a system/receiving issue.<br><br>The PO may have been <strong>INTRANSIT</strong> earlier, but that is no longer the current story. There is now a GR blocker that needs action.`,q:"What should you do?",opts:[
["Leave AMS as INTRANSIT because that was the last status before delivery.","bad","a5b"],["Drive the GR blocker with the responsible team, keep the AMP/action open until resolved, and update AMS to reflect the current GR-blocked situation used by your process.","good","a5b"],["Set AMS to ON TRACK because the truck arrived.","bad","a5b"],["Close the AMP because the material is physically at site.","delay","a5b"]]},
a5b:{id:"a5b",n:"12",time:"05:00 PM • GR RESOLVED",title:"THE PO STORY CATCHES UP",story:`The GR blocker is resolved. The receipt is now correctly posted and the order is no longer waiting on the receiving issue.<br><br>The key lesson: when the blocker changes, the <strong>AMP action, PO data and AMS story</strong> must all catch up.`,q:"What is the final control?",opts:[

a6:{id:"a6",n:"13",time:"FINAL REVIEW • AMP + AMS",title:"ONE PO — ONE STORY",story:`You open the PO one last time.<br><br>At every point, the question was not simply <em>“Did I update the AMP?”</em> It was:<br><br><strong>“Does the AMP show the action I am driving, and does AMS + the PO date tell the truth about where the order is right now?”</strong><br><br>That is the control loop.`,q:"What is the principle you should take back to the desk?",opts:[
["AMP is the action to drive; AMS and the PO data must continuously reflect the latest real situation. When the supplier answers, update the date/status and close with the outcome.","good","a_end_good"],["AMP is enough; AMS can be updated at the end of the month.","bad","a_end_bad"],["AMS is enough; supplier actions can stay open as long as the status looks right.","bad","a_end_bad"],["The fastest way to improve KPIs is to close AMPs even when the PO story is incomplete.","bad","a_end_bad"]]},

function renderAMP(){
 const s=ampScenes[current];
 document.getElementById("progress").textContent=s.id.startsWith("a_end")?"FINAL OUTCOME":`LEVEL 4 • AMP DECISION ${decisions}`;
 if(s.id.startsWith("a_end")) return ampEnding(s.id);
 app.innerHTML=`<div class="card">
 <div class="scene" style="color:#f3c969">LEVEL 4 • SCENE ${s.n} • ${s.title}</div>
 <div class="time">${s.time}</div>
 <div class="story">${s.story.replace(/\n/g,"<br>")}</div>
 <div class="question">${s.q}</div>
 <div class="options">${s.opts.map((o,i)=>`<button class="option" onclick="chooseAMP(${i})"><b>${String.fromCharCode(65+i)}</b>${o[0]}</button>`).join("")}</div>
 <div id="feedback" class="feedback"></div>
 <button id="next" class="continue" onclick="nextAMP()">CONTINUE →</button>
 </div>`;
}
function chooseAMP(i){
 const s=ampScenes[current], opt=s.opts[i], type=opt[1];
 document.querySelectorAll(".option").forEach(b=>b.disabled=true);
 decisions++;
 const fb=document.getElementById("feedback");
 if(type==="good"){score++;fb.className="feedback good";fb.innerHTML="<strong>Good AMP control.</strong><br>You are managing the action, not just the status.";}
 else if(type==="delay"){delays++;fb.className="feedback mid";fb.innerHTML="<strong>Risk recorded.</strong><br>The AMP can remain open without a real next action. The next scene will show the consequence.";}
 else {mistakes++;fb.className="feedback bad";fb.innerHTML="<strong>Wrong control point.</strong><br>You either closed too early, skipped supplier validation or left the order record misleading.";}
 fb.style.display="block";document.getElementById("next").style.display="inline-block";window.pendingAMP=opt[2];
}
function nextAMP(){current=window.pendingAMP;renderAMP();}
function ampEnding(kind){
 document.getElementById("progress").textContent="FINAL OUTCOME";
 if(kind==="a_end_good"){
 app.innerHTML=`<div class="card ending good"><div class="emoji">🏆</div><div class="scene">LEVEL 4 RESULT</div><h2>AMP + AMS MASTER</h2><p>You learned the key control: <strong>the AMP, the PO data and the AMS story must move together.</strong></p><div class="amp-playbook"><h3>YOUR AMP + AMS PLAYBOOK</h3><div class="rule"><strong>1 • AMP = ACTION</strong><br>AMP tells you what action must be driven: expedite, de-expedite or cancellation.</div><div class="rule"><strong>2 • AMS = PO STORY</strong><br>AMS must tell the current reality of the PO — not an old step in its history.</div><div class="rule"><strong>3 • SUPPLIER RESPONSE = UPDATE THE PO</strong><br>When the supplier gives a new commitment, update the <strong>delivery date + AMS</strong>, communicate the outcome and then close the AMP.</div><div class="rule"><strong>4 • BLOCKER = VISIBLE STORY</strong><br>If the PO is blocked by <strong>Sourcing/PIR</strong>, GR or another process issue, the AMS must reflect that current blocker while the AMP drives its resolution.</div><div class="rule"><strong>5 • AWAITING VENDOR IS NOT CLOSURE</strong><br>Contact the supplier, set Awaiting Vendor when you are genuinely waiting, <strong>chase</strong> when needed, and close only with a real answer.</div><div class="rule"><strong>6 • HIGH-VALUE + CURRENT-QUARTER EXPEDITE</strong><br>Treat it as urgent: <strong>email + call</strong> the supplier and obtain a clear commitment.</div><div class="rule"><strong>7 • DE-EXPEDITE + NO CONFIRMED DATE</strong><br>Get the supplier's real position first. Then <strong>change the line date + update AMS + inform the supplier</strong>.</div><div class="rule"><strong>8 • GR BLOCKER</strong><br>Arrival does not automatically mean a healthy PO. Drive the GR resolution and keep the PO story aligned until the blocker is cleared.</div><div class="takeaway">💡 <strong>One PO. One story. AMP drives the action. AMS tells the truth.</strong></div></div><div class="score">${name?name+' • ':''}${score} good decisions • ${mistakes} risky decisions • ${delays} delayed decisions</div><button class="restart" onclick="start()">BACK TO MISSIONS</button></div>`;
 } else {
 app.innerHTML=`<div class="card ending bad"><div class="emoji">🔴</div><div class="scene">LEVEL 4 RESULT</div><h2>AMP + AMS LESSON</h2><p>You reached the end, but some actions were not kept aligned with the PO story.</p><div class="amp-playbook"><h3>THE RULE TO REMEMBER</h3><div class="takeaway"><strong>Do not manage AMP and AMS separately.</strong><br>When the situation changes, update the action, the PO data and the AMS story together.</div><div class="rule"><strong>Supplier gives a new date?</strong> Update the line date + AMS, then close the AMP with the answer.</div><div class="rule"><strong>Price/PIR blocker?</strong> Drive Sourcing and make the blocker visible in AMS.</div><div class="rule"><strong>GR blocker?</strong> Drive the resolution and keep the PO story aligned.</div><div class="rule"><strong>Awaiting Vendor?</strong> Wait, chase, then close only with a real supplier outcome.</div></div><div class="score">${name?name+' • ':''}${score} good decisions • ${mistakes} risky decisions • ${delays} delayed decisions</div><button class="restart" onclick="start()">TRY AMP + AMS AGAIN</button></div>`;

 }
}

function otdEnding(kind){
 let title,emoji,cls,text;
 if(kind==="o_end_good" && mistakes===0 && delays===0){title="OTD VETTING — CONTROLLED";emoji="🏆";cls="good";text=`You completed the month-end control correctly. Every current-month delivered line was vetted, every exception was investigated, VPD was corrected where required, and AMS was aligned with the CLM process.`;}
 else if(kind==="o_end_good"||kind==="o_end_recovery"){title="RECOVERED — BUT INCOMPLETE";emoji="🟡";cls="mid";text=`The month was eventually brought under control, but some lines were delayed, incompletely vetted or required recovery.`;}
 else {title="OTD STORY NOT TRUSTWORTHY";emoji="🔴";cls="bad";text=`The month was closed without a reliable line-by-line vetting trail. A KPI cannot be trusted if the underlying PO data, VPD and AMS story are not aligned.`;}
 app.innerHTML=`<div class="card ending ${cls}"><div class="emoji">${emoji}</div><div class="scene">LEVEL 6 RESULT</div><h2>${title}</h2><p>${text}</p><div class="amp-playbook"><h3>OTD VETTING PLAYBOOK</h3><div class="rule"><strong>1 • VET EVERY CURRENT-MONTH LINE</strong><br>At month-end, every relevant line delivered in the current month must be reviewed.</div><div class="rule"><strong>2 • CHECK WHAT IS NOT ON TIME</strong><br>Investigate every exception. Do not simply mark it late and move on.</div><div class="rule"><strong>3 • CORRECT VPD WHEN REQUIRED</strong><br>If a valid supplier commitment changed the expected delivery date, update VPD with the correct evidence.</div><div class="rule"><strong>4 • ALIGN AMS WITH CLM</strong><br>AMS must reflect the current PO story according to the CLM process. Keep the history traceable, but do not leave an obsolete status as the current story.</div><div class="rule"><strong>5 • OTD = THE RESULT OF GOOD DATA</strong><br>The KPI is only as trustworthy as the line-level vetting behind it.</div><div class="takeaway">💡 <strong>Every line. Every exception. Correct VPD. Correct AMS. Then close the month.</strong></div></div><div class="score">${name?name+' • ':''}${score} good decisions • ${mistakes} risky decisions • ${delays} delayed decisions</div><button class="restart" onclick="start()">BACK TO MISSIONS</button></div>`;
}

function launch(mode){
 if(mode==="core"){current="start";mission="core";render();}
 else if(mode==="control"){current="c1";mission="control";renderMission(controlScenes);}
 else if(mode==="boss"){current="b1";mission="boss";renderMission(bossScenes);}
 else if(mode==="amp"){current="a1";mission="amp";renderAMP();}
 else if(mode==="escalation"){current="e1";mission="escalation";score=0;mistakes=0;delays=0;decisions=0;renderMission(escalationScenes);}
 else if(mode==="otd"){current="o1";mission="otd";score=0;mistakes=0;delays=0;decisions=0;renderMission(otdScenes);}
}
let mission="core";
function renderMission(data){
 const s=data[current];
 const endId = mission==="escalation" ? "e_end" : mission==="otd" ? "o_end" : "e_end";
 const levelNum = mission==="escalation"?5:mission==="otd"?6:mission==="boss"?3:2;
 document.getElementById("progress").textContent=(s.id.startsWith(endId)?"FINAL OUTCOME":`LEVEL ${levelNum} • DECISION ${decisions}`);
 if(s.id.startsWith("e_end")) return escalationEnding(s.id);
 if(s.id.startsWith("o_end")) return otdEnding(s.id);
 app.innerHTML=`<div class="card">
 <div class="scene">${mission==="escalation"?"LEVEL 5":mission==="otd"?"LEVEL 6":mission==="boss"?"BOSS LEVEL":"LEVEL 2"} • SCENE ${s.n} • ${s.title}</div><div class="time">${s.time}</div>
 <div class="story">${s.story}</div>
 <div class="question">${s.q}</div>
 <div class="options">${s.opts.map((o,i)=>`<button class="option" onclick="chooseMission(${i})"><b>${String.fromCharCode(65+i)}</b>${o[0]}</button>`).join("")}</div>
 <div id="feedback" class="feedback"></div><button id="next" class="continue" onclick="nextMission()">CONTINUE →</button></div>`;
}
function chooseMission(i){
 const data=mission==="escalation"?escalationScenes:mission==="otd"?otdScenes:mission==="boss"?bossScenes:controlScenes;
 const s=data[current],opt=s.opts[i],type=opt[1];
 document.querySelectorAll(".option").forEach(b=>b.disabled=true); decisions++;
 const fb=document.getElementById("feedback");
 if(type==="good"){score++;fb.className="feedback good";fb.innerHTML="<strong>Protocol followed.</strong><br>You chose the controlled path. The next scene reflects the consequence.";}
 else if(type==="delay"){delays++;fb.className="feedback mid";fb.innerHTML="<strong>Too slow.</strong><br>You lost time or left the issue without enough follow-up.";}
 else {mistakes++;fb.className="feedback bad";fb.innerHTML="<strong>Escalation risk.</strong><br>You skipped a control step or escalated without enough evidence.";}
 fb.style.display="block";document.getElementById("next").style.display="inline-block";window.pendingNext=opt[2];
}
function nextMission(){current=window.pendingNext;const data=mission==="escalation"?escalationScenes:mission==="otd"?otdScenes:mission==="boss"?bossScenes:controlScenes;renderMission(data);}
function escalationEnding(kind){
 let title,emoji,cls,text;
 if(kind==="e_end_good" && mistakes===0 && delays===0){title="ESCALATION CONTROLLED";emoji="🟢";cls="good";text=`You followed the escalation ladder without losing ownership.<br><br><strong>Direct contact → reminders → Team Lead → Supplier Leader → actual supplier response.</strong><br><br>You escalated with evidence, at the right time, and closed only when the real answer was received.`;}
 else if(kind==="e_end_good"||kind==="e_end_recovery"){title="RECOVERED — BUT SLOW";emoji="🟡";cls="mid";text=`The supplier issue was eventually resolved, but some escalation steps were delayed or handled inefficiently.<br><br><strong>Escalation should create pressure and clarity — not just more emails.</strong>`;}
 else {title="ESCALATION LOST";emoji="🔴";cls="bad";text=`The issue was escalated without a controlled trail or the action was closed without a real supplier outcome.<br><br><strong>Never confuse “someone is looking into it” with “the supplier has answered”.</strong>`;}
 app.innerHTML=`<div class="card ending ${cls}"><div class="emoji">${emoji}</div><div class="scene">LEVEL 5 RESULT</div><h2>${title}</h2><p>${text}</p><div class="amp-playbook"><h3>ESCALATION PROTOCOL</h3><div class="rule"><strong>1 • DIRECT SUPPLIER CONTACT</strong><br>Call + send reminders. Make the request and required response clear.</div><div class="rule"><strong>2 • TEAM LEAD</strong><br>If the supplier remains unresponsive, escalate with the PO, history, urgency and business impact.</div><div class="rule"><strong>3 • SUPPLIER LEADER</strong><br>If Team Lead intervention does not get a response, escalate to the Supplier Leader with the full trail.</div><div class="rule"><strong>4 • CLOSE WITH FACTS</strong><br>Do not close because someone promised to investigate. Close with the actual supplier response and update the PO/AMS as required.</div><div class="takeaway">💡 <strong>Escalation is a ladder, not a shortcut.</strong></div></div><div class="score">${name?name+' • ':''}${score} good decisions • ${mistakes} risky decisions • ${delays} delayed decisions</div><button class="restart" onclick="start()">BACK TO MISSIONS</button></div>`;
}

function render(){
 const s=scenes[current];
 document.getElementById("progress").textContent=s.id==="start"?"BRIEFING":`DECISION ${decisions}`;
 if(s.id.startsWith("end_")) return ending(s.id);
 app.innerHTML=`<div class="card">
 <div class="scene">SCENE ${s.n} • ${s.title}</div><div class="time">${s.time}</div>
 <div class="story">${s.story}</div>
 <div class="question">${s.q}</div>
 <div class="options">${s.opts.map((o,i)=>`<button class="option" onclick="choose(${i})"><b>${String.fromCharCode(65+i)}</b>${o[0]}</button>`).join("")}</div>
 <div id="feedback" class="feedback"></div>
 <button id="next" class="continue" onclick="next()">CONTINUE →</button>
 </div>`;
}
function choose(i){
 const s=scenes[current], opt=s.opts[i], type=opt[1];
 document.querySelectorAll(".option").forEach(b=>b.disabled=true);
 decisions++;
 const fb=document.getElementById("feedback");
 if(type==="good"){score++;fb.className="feedback good";fb.innerHTML="<strong>Decision recorded.</strong><br>You identified the risk and kept the journey moving. But your next scene depends on what you just chose…";}
 else if(type==="delay"){delays++;fb.className="feedback mid";fb.innerHTML="<strong>Decision recorded.</strong><br>You chose a slower path. Time has been lost, and the next scene will reflect that consequence.";}
 else {mistakes++;fb.className="feedback bad";fb.innerHTML="<strong>Decision recorded.</strong><br>This creates an avoidable risk. The next scene will show what happens because of it.";}
 fb.style.display="block";
 document.getElementById("next").style.display="inline-block";
 window.pendingNext=opt[2];
}
function next(){current=window.pendingNext;render();}
function ending(kind){
 let title,emoji,text,cls;
 if(kind==="end_good" && mistakes===0 && delays===0){title="SUPPLY CHAIN HERO";emoji="🏆";cls="good";text=`You made the right calls at every critical point.<br><br>PO acknowledged. Risks resolved. Delivery managed. GR completed. OTD reviewed.<br><br><strong>The tool reached the customer — on time.</strong>`;}
 else if(kind==="end_good"){title="RECOVERY SPECIALIST";emoji="🟡";cls="mid";text=`You didn't have a perfect journey, but you recovered the situation and kept the customer impact under control.<br><br><strong>That's Supply Chain:</strong> spot the risk, act, recover.`;}
 else {title="CUSTOMER IMPACT";emoji="🔴";cls="bad";text=`Several risks were allowed to grow before being addressed.<br><br>The customer now feels the impact of decisions made earlier in the journey.<br><br><strong>One missed action can create consequences much further down the chain.</strong>`;}
 document.getElementById("progress").textContent="FINAL OUTCOME";
 app.innerHTML=`<div class="card ending ${cls}"><div class="emoji">${emoji}</div><div class="scene">FINAL OUTCOME</div><h2>${title}</h2><p>${text}</p><div class="score">${name?name+" • ":""}${score} good decisions • ${mistakes} risky decisions • ${delays} delayed decisions</div><button class="restart" onclick="start()">PLAY AGAIN</button></div>`;
}
